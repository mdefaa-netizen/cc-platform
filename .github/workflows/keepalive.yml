name: Keepalive Streamlit App

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -fsSL --retry 3 --retry-delay 10 --max-time 60 \
            https://cc-platform-lwgykmwhsbf954mjqsdgl5.streamlit.app
